name: Apply six-work corpus cleanup

on:
  push:
    branches:
      - cleanup/remove-six-noncorpus

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-six-noncorpus
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply cleanup
        run: python3 scripts/apply_remove_six_noncorpus.py
      - name: Remove one-shot machinery
        run: |
          rm scripts/apply_remove_six_noncorpus.py
          rm .github/workflows/apply-remove-six.yml
      - name: Validate
        run: scripts/validate_all.sh
      - name: Commit generated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove six non-corpus works"
          git push origin HEAD:cleanup/remove-six-noncorpus
