name: Migrate authoritative corpus
on:
  push:
    branches: [authoritative-three-set-cleanup]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build authoritative corpus
        run: |
          python3 scripts/migrate_authoritative_three_set.py
          python3 scripts/validate_authoritative_corpus.py
      - name: Commit migrated corpus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows/export-working-tree.yml
          git diff --cached --stat
          git commit -m "Adopt the authoritative three-set corpus"
          git push origin HEAD:authoritative-three-set-cleanup
