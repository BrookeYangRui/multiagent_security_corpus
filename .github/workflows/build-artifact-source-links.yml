name: Build artifact source links

on:
  push:
    branches:
      - artifact/source-links-189

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: artifact/source-links-189
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate artifact source list
        run: python3 scripts/build_artifact_source_links.py
      - name: Validate generated list
        run: |
          test -f artifact/README.md
          test "$(grep -cE '^[0-9]+\. \[' artifact/README.md)" -eq 189
          ! grep -q 'N/A)' artifact/README.md
      - name: Commit generated artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifact/README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add 189-work artifact source links"
          git push origin HEAD:artifact/source-links-189
