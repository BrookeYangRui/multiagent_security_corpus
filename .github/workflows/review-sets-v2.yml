name: Review sets v2

on:
  push:
    branches:
      - complete-review-sets-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out corpus
        uses: actions/checkout@v4

      - name: Check out SoK search snapshot
        uses: actions/checkout@v4
        with:
          repository: BrookeYangRui/usenix27-SoK
          ref: safe-human-kim-audit
          path: sok

      - name: Profile source tables
        run: |
          mkdir -p artifact/search/v2
          python - <<'PY' | tee artifact/search/v2/input_profile.txt
          import csv, json
          from collections import Counter, defaultdict
          from pathlib import Path

          root = Path('.')
          paths = [
              root/'sok/artifact/search/systematic_complete_screening.csv',
              root/'sok/artifact/search/systematic_search_screening.csv',
              root/'sok/artifact/search/venue_screen_inclusion_candidates.csv',
              root/'sok/artifact/search/targeted_gap_search.csv',
              root/'corpus/papers.csv',
              root/'reviews/universal/active_source_review.csv',
              root/'corpus/sets/03_taxonomy_eligible/taxonomy_candidates.csv',
          ]
          for path in paths:
              print('\n###', path)
              if not path.exists():
                  print('MISSING')
                  continue
              with path.open(encoding='utf-8-sig', newline='') as h:
                  reader = csv.DictReader(h)
                  rows = list(reader)
              print('rows', len(rows))
              print('fields', json.dumps(reader.fieldnames, ensure_ascii=False))
              for field in reader.fieldnames or []:
                  low = field.lower()
                  if any(k in low for k in ('route','source','decision','scope','year','date','doi','arxiv','candidate','status')):
                      counts = Counter((r.get(field) or '').strip() for r in rows)
                      print('field', field, 'top', counts.most_common(12))
              for row in rows[:2]:
                  print('sample', json.dumps(row, ensure_ascii=False)[:4000])

          source = root/'sok/artifact/search/systematic_complete_screening.csv'
          if source.exists():
              with source.open(encoding='utf-8-sig', newline='') as h:
                  rows = list(csv.DictReader(h))
              print('\n### duplicate public identifiers in systematic_complete_screening')
              for field in ('doi','canonical_doi','arxiv_id'):
                  if rows and field in rows[0]:
                      groups = defaultdict(list)
                      for row in rows:
                          value = (row.get(field) or '').strip().lower()
                          if value:
                              groups[value].append((row.get('record_id',''), row.get('title','')))
                      dups = {k:v for k,v in groups.items() if len(v)>1}
                      print(field, 'duplicates', len(dups))
                      for key, vals in list(dups.items())[:20]:
                          print(key, vals)
          PY

      - name: Upload profile
        uses: actions/upload-artifact@v4
        with:
          name: review-set-input-profile
          path: artifact/search/v2/input_profile.txt
