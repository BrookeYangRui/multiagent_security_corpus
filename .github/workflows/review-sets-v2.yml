name: Review sets v2

on:
  push:
    branches:
      - complete-review-sets-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out corpus
        uses: actions/checkout@v4

      - name: Record branch state
        run: |
          mkdir -p artifact/search/v2
          git rev-parse HEAD > artifact/search/v2/corpus_snapshot_commit.txt
          find corpus reviews scripts tests .github -type f -print | sort > artifact/search/v2/corpus_snapshot_files.txt

      - name: Upload corpus snapshot
        uses: actions/upload-artifact@v4
        with:
          name: corpus-v2-working-snapshot
          path: |
            AGENTS.md
            README.md
            Makefile
            pyproject.toml
            corpus/
            reviews/
            scripts/
            tests/
            .github/
            artifact/search/v2/
          if-no-files-found: error
