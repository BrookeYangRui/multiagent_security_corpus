name: Build Section 4 audit view

on:
  push:
    branches:
      - section4-audit-20260821

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: section4-audit-20260821
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_section4_audit_view.py
      - run: |
          rm .github/workflows/build-section4-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corpus/section4_audit_view.csv .github/workflows/build-section4-audit.yml
          git commit -m "Build 201-work Section 4 audit view"
          git push origin HEAD:section4-audit-20260821
