name: Confirm three-set corpus v2

on:
  push:
    branches:
      - three-set-corpus-review
    paths:
      - .github/workflows/confirm-three-set-v2.yml
      - corpus/set1_core.csv
      - corpus/set2_emerging.csv
      - corpus/set3_context.csv
      - corpus/screened_out.csv
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out reviewed branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for generated sets
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            git fetch --quiet origin three-set-corpus-review
            git reset --hard --quiet origin/three-set-corpus-review
            if [ -f corpus/set1_core.csv ] && [ -f corpus/set2_emerging.csv ] && \
               [ -f corpus/set3_context.csv ] && [ -f corpus/screened_out.csv ] && \
               [ -f scripts/validate_three_set_corpus.py ]; then
              ready=1
              break
            fi
            sleep 20
          done
          test "$ready" = 1

      - name: Validate generated sets
        shell: bash
        run: |
          set -euo pipefail
          test ! -e corpus/primary.csv
          test ! -e corpus/secondary.csv
          test ! -e corpus/pending.csv
          test ! -e corpus/review_queue.csv
          python scripts/validate_three_set_corpus.py

      - name: Write validation status
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path('.')
          files = {
              'set1_core':'set1_core.csv',
              'set2_emerging':'set2_emerging.csv',
              'set3_context':'set3_context.csv',
              'screened_out':'screened_out.csv',
          }
          counts = {}
          for key, filename in files.items():
              with (root/'corpus'/filename).open(encoding='utf-8-sig', newline='') as handle:
                  counts[key] = sum(1 for _ in csv.DictReader(handle))
          manifest = json.loads((root/'corpus/manifest.json').read_text(encoding='utf-8'))
          status = {
              'validated_at_utc': datetime.now(timezone.utc).isoformat(),
              'validated_parent_commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'search_universe': sum(counts.values()),
              'counts': counts,
              'total_mas_security_corpus': counts['set1_core'] + counts['set2_emerging'],
              'literature_cutoff': manifest['literature_cutoff'],
              'citation_snapshot_date': manifest['citation_snapshot_date'],
              'set1_rule': manifest['set1_maturity_rule'],
              'verification': 'model-assisted source review; named-author signoff required',
          }
          (root/'corpus/FINAL_THREE_SET_STATUS.json').write_text(json.dumps(status, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          print(json.dumps(status, indent=2, sort_keys=True))
          PY

      - name: Normalize validation entry points
        shell: bash
        run: |
          cat > scripts/validate_all.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          python scripts/validate_three_set_corpus.py
          EOF
          chmod +x scripts/validate_all.sh
          cat > scripts/validate_authoritative_corpus.py <<'EOF'
          #!/usr/bin/env python3
          from pathlib import Path
          import runpy
          runpy.run_path(str(Path(__file__).with_name("validate_three_set_corpus.py")), run_name="__main__")
          EOF
          chmod +x scripts/validate_authoritative_corpus.py

      - name: Remove one-shot migration workflows and scripts
        shell: bash
        run: |
          rm -f .github/workflows/confirm-three-set-v2.yml
          rm -f .github/workflows/confirm-and-promote-three-set.yml
          rm -f .github/workflows/promote-three-set-main.yml
          rm -f .github/workflows/finalize-three-set-repo.yml
          rm -f .github/workflows/build-three-set-corpus.yml
          rm -f scripts/build_three_set_corpus.py
          rm -rf .bootstrap review-evidence

      - name: Commit and fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Finalize and validate the three-set corpus"
          fi
          git fetch --quiet origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:three-set-corpus-review
          git push origin HEAD:main
