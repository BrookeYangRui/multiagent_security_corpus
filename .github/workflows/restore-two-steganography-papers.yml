name: Restore two steganography papers

on:
  push:
    branches:
      - restore/two-steganography-papers

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restore/two-steganography-papers
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore papers
        run: python3 scripts/restore_two_steganography_papers.py
      - name: Remove one-shot machinery
        run: |
          rm scripts/restore_two_steganography_papers.py
          rm .github/workflows/restore-two-steganography-papers.yml
      - name: Validate
        run: scripts/validate_all.sh
      - name: Commit restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore two steganography MAS-security papers"
          git push origin HEAD:restore/two-steganography-papers
