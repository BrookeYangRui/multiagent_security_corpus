name: Fix Semantic Taint risk mapping

on:
  push:
    branches:
      - fix/semantic-taint-risk

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/semantic-taint-risk
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply taxonomy correction
        run: python3 scripts/fix_semantic_taint_risk.py
      - name: Remove one-shot migration files
        run: |
          rm -f scripts/fix_semantic_taint_risk.py
          rm -f .github/workflows/fix-semantic-taint-risk.yml
      - name: Validate corpus
        run: scripts/validate_all.sh
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Correct Semantic Taint risk to private-data leakage"
          git push origin HEAD:fix/semantic-taint-risk
