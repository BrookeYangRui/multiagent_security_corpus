name: Rebuild corpus membership

on:
  push:
    branches:
      - agent/rebuild-corpus-membership
    paths:
      - .github/workflows/rebuild-corpus-membership.yml
      - scripts/rebuild_membership_from_ledger.py
      - scripts/patch_source_scope_policy.py
      - scripts/validate_three_set_corpus.py
      - CORPUS_SET_POLICY.md
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out review branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore frozen review inputs and source builder
        shell: bash
        run: |
          set -euo pipefail
          # Every rerun starts from the same pre-policy 2,217-work ledger. This
          # prevents an automated output from becoming the next run's prior label.
          git show cb74a98e0f7abb42a04b587efb6e902072d0d651:corpus/review_ledger.csv > corpus/review_ledger.csv
          rm -f corpus/review_queue.csv
          git show f5c205eeaa3db336b07d5ca0ba0b0c8588e234a1:scripts/build_three_set_corpus.py > scripts/build_three_set_corpus.py
          git show f5c205eeaa3db336b07d5ca0ba0b0c8588e234a1:scripts/rebuild_three_set_from_evidence_v2.py > scripts/rebuild_three_set_from_evidence_v2.py
          python scripts/patch_source_scope_policy.py scripts/build_three_set_corpus.py

      - name: Download frozen source-review artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf review-evidence
          mkdir -p review-evidence

          download_run() {
            local run_id="$1"
            local destination="$2"
            for attempt in 1 2 3; do
              rm -rf "$destination"
              mkdir -p "$destination"
              if gh run download "$run_id" --repo BrookeYangRui/multiagent_security_corpus --dir "$destination"; then
                return 0
              fi
              sleep $((attempt * 5))
            done
            return 1
          }

          download_run 31990472611 review-evidence/full-source-review
          download_run 31991087846 review-evidence/metadata-review
          download_run 31994103912 review-evidence/blocked-source-review

      - name: Re-screen all 2,217 works from source evidence
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path('scripts/rebuild_three_set_from_evidence_v2.py')
          spec = importlib.util.spec_from_file_location('source_rebuild', path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          module.reconstruct_queue()
          builder = module.load_module()
          evidence_index = module.make_index(builder)
          builder.load_source_index = lambda: evidence_index
          raise SystemExit(builder.main())
          PY

      - name: Apply membership and readiness separation
        run: python scripts/rebuild_membership_from_ledger.py

      - name: Remove one-shot reconstruction inputs
        shell: bash
        run: |
          rm -rf review-evidence
          rm -f corpus/review_queue.csv
          rm -f scripts/build_three_set_corpus.py
          rm -f scripts/rebuild_three_set_from_evidence_v2.py

      - name: Validate authoritative sets
        run: python scripts/validate_three_set_corpus.py

      - name: Show resulting counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('corpus/manifest.json').read_text())
          print(json.dumps({
              'counts': m['counts'],
              'corpus_counts': m['corpus_counts'],
              'taxonomy_ready_set1_count': m.get('taxonomy_ready_set1_count'),
              'citation_threshold': m.get('citation_threshold'),
              'set1_maturity_rule': m.get('set1_maturity_rule'),
              'scope_rule': m.get('scope_rule'),
          }, indent=2, sort_keys=True))
          PY

      - name: Commit regenerated corpus views
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corpus
          if git diff --cached --quiet; then
            echo "No generated corpus changes"
            exit 0
          fi
          git commit -m "Re-screen corpus under separated scope and evidence rules"
          git push origin HEAD:agent/rebuild-corpus-membership
