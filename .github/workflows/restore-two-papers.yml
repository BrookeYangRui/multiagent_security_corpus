name: Restore two MAS security papers

on:
  push:
    branches:
      - restore-whispering-tool-steg
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  restore:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[restored two papers]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: restore-whispering-tool-steg
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore corpus rows and paper notes
        run: python scripts/finish_restore.py
      - name: Validate corpus
        run: scripts/validate_all.sh
      - name: Commit validated restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/restore_two_papers.py scripts/finish_restore.py .github/workflows/restore-two-papers.yml .restore-trigger
          git add -A
          git commit -m "[restored two papers] Restore Whispering Agents and Tool Use steganography"
          git push origin HEAD:restore-whispering-tool-steg
