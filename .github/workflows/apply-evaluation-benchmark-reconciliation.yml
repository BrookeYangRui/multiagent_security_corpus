name: Apply evaluation benchmark reconciliation

on:
  push:
    branches:
      - main
      - freeze/evaluation-benchmark-2026-08-18

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[reconciliation-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out pushed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply adjudications and rebuild corpus
        run: python3 scripts/apply_evaluation_benchmark_reconciliation.py

      - name: Validate frozen corpus
        run: scripts/validate_all.sh

      - name: Commit generated corpus revision
        run: |
          rm .github/workflows/apply-evaluation-benchmark-reconciliation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Freeze evaluation and benchmark reconciliation [reconciliation-generated]"
          git push origin HEAD:${{ github.ref_name }}
