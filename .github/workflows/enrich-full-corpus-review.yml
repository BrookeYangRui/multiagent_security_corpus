name: Enrich full corpus review

on:
  push:
    branches:
      - full-corpus-expert-review
    paths:
      - .github/workflows/enrich-full-corpus-review.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enrich:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out corpus
        uses: actions/checkout@v4

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Enrich candidate sources
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 8
        run: |
          mkdir -p review-enrichment
          python - <<'PY'
          from __future__ import annotations
          import csv, gzip, hashlib, html, json, os, re, subprocess, tempfile, time, urllib.parse, urllib.request
          from pathlib import Path
          from xml.etree import ElementTree as ET

          ROOT=Path('.')
          shard=int(os.environ['SHARD']); shards=int(os.environ['SHARDS'])
          rows=[]
          for decision in ('primary','secondary','pending'):
              path=ROOT/'corpus'/f'{decision}.csv'
              if not path.exists(): continue
              with path.open(encoding='utf-8-sig',newline='') as h:
                  for row in csv.DictReader(h):
                      row=dict(row); row['starting_decision']=decision; rows.append(row)
          rows=sorted(rows,key=lambda r:r.get('work_key',''))
          rows=[r for i,r in enumerate(rows) if i % shards == shard]
          UA='MAS-SoK-source-review/2.0 (mailto:ryang54@jh.edu)'

          def clean(v):
              if v is None: return ''
              v=html.unescape(str(v)); v=re.sub(r'<[^>]+>',' ',v); return re.sub(r'\s+',' ',v).strip()

          def req(url, accept='application/json', attempts=4, timeout=45):
              last=''
              for a in range(attempts):
                  try:
                      request=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':accept})
                      with urllib.request.urlopen(request,timeout=timeout) as r:
                          return r.read(), dict(r.headers), ''
                  except Exception as e:
                      last=repr(e); time.sleep(min(8,0.6*(2**a)))
              return b'',{},last

          def json_req(url):
              data,_,err=req(url)
              if not data: return None,err
              try: return json.loads(data),''
              except Exception as e: return None,repr(e)

          def inv_abs(inv):
              if not isinstance(inv,dict): return ''
              pos=[]
              for w,ps in inv.items():
                  for p in ps or []: pos.append((int(p),w))
              return clean(' '.join(w for _,w in sorted(pos)))

          arxiv_ids=[r.get('arxiv_id','').strip() for r in rows if r.get('arxiv_id','').strip()]
          arxiv_meta={}
          for start in range(0,len(arxiv_ids),25):
              ids=arxiv_ids[start:start+25]
              url='https://export.arxiv.org/api/query?id_list='+urllib.parse.quote(','.join(ids))+'&max_results='+str(len(ids))
              data,_,err=req(url,accept='application/atom+xml')
              if data:
                  try:
                      root=ET.fromstring(data); ns={'a':'http://www.w3.org/2005/Atom'}
                      for e in root.findall('a:entry',ns):
                          aid=e.findtext('a:id','',ns).rsplit('/',1)[-1].split('v')[0]
                          arxiv_meta[aid]={
                            'arxiv_title':clean(e.findtext('a:title','',ns)),
                            'arxiv_abstract':clean(e.findtext('a:summary','',ns)),
                            'arxiv_published':clean(e.findtext('a:published','',ns)),
                            'arxiv_updated':clean(e.findtext('a:updated','',ns)),
                            'arxiv_categories':';'.join(x.attrib.get('term','') for x in e.findall('a:category',ns)),
                          }
                  except Exception as e: err=repr(e)
              if err:
                  for aid in ids: arxiv_meta.setdefault(aid,{'arxiv_error':err})
              time.sleep(1.0)

          def candidate_pdf_urls(row, oa, s2):
              urls=[]
              aid=row.get('arxiv_id','').strip()
              if aid: urls.append('https://arxiv.org/pdf/'+aid)
              if oa:
                  for loc in [oa.get('best_oa_location') or {}, oa.get('primary_location') or {}]+list(oa.get('locations') or [])[:8]:
                      u=loc.get('pdf_url') or ''
                      if u: urls.append(u)
              if s2:
                  oa_pdf=(s2.get('openAccessPdf') or {}).get('url') or ''
                  if oa_pdf: urls.append(oa_pdf)
              u=row.get('primary_url','').strip()
              if u.lower().endswith('.pdf'): urls.append(u)
              # Common official landing-page transformations.
              if 'aclanthology.org/' in u and not u.endswith('.pdf'): urls.append(u.rstrip('/')+'.pdf')
              if 'proceedings.mlr.press/' in u and u.endswith('.html'): urls.append(u[:-5]+'/'+u.rsplit('/',1)[-1][:-5]+'.pdf')
              seen=set(); out=[]
              for u in urls:
                  if u and u not in seen: seen.add(u); out.append(u)
              return out

          KW=re.compile(r'(?i)multi[- ]agent|agent[- ]to[- ]agent|inter[- ]agent|security|attack|adversar|malicious|threat|defen[cs]e|privacy|confidential|integrity|availability|collusion|propagat|delegat|consensus|byzantine|poison|jailbreak|prompt injection|leak|authorization|authentication|trust|failure|risk')
          def pdf_evidence(urls):
              errors=[]
              for url in urls[:6]:
                  data,headers,err=req(url,accept='application/pdf',attempts=2,timeout=60)
                  if err or not data:
                      errors.append(url+':'+err); continue
                  ctype=(headers.get('Content-Type') or '').lower()
                  if len(data)<1000 or (not data.startswith(b'%PDF') and 'pdf' not in ctype):
                      errors.append(url+':not_pdf'); continue
                  if len(data)>30_000_000:
                      errors.append(url+':too_large'); continue
                  with tempfile.TemporaryDirectory() as td:
                      pdf=Path(td)/'paper.pdf'; txt=Path(td)/'paper.txt'; pdf.write_bytes(data)
                      proc=subprocess.run(['pdftotext','-layout','-f','1','-l','40',str(pdf),str(txt)],capture_output=True,text=True,timeout=90)
                      if proc.returncode or not txt.exists():
                          errors.append(url+':pdftotext:'+proc.stderr[-200:]); continue
                      text=txt.read_text(encoding='utf-8',errors='ignore')
                  text=re.sub(r'\x00','',text)
                  words=len(text.split())
                  first=text[:16000]
                  windows=[]
                  for m in KW.finditer(text):
                      a=max(0,m.start()-450); b=min(len(text),m.end()+700)
                      w=re.sub(r'\s+',' ',text[a:b]).strip()
                      if w and w not in windows: windows.append(w)
                      if len(windows)>=35: break
                  return {
                    'pdf_url_used':url,
                    'pdf_sha256':hashlib.sha256(data).hexdigest(),
                    'pdf_bytes':len(data),
                    'pdf_text_words_first40':words,
                    'pdf_first_text':first,
                    'pdf_keyword_windows':'\n---WINDOW---\n'.join(windows),
                    'pdf_fetch_errors':' | '.join(errors),
                  }
              return {'pdf_fetch_errors':' | '.join(errors)}

          output=[]
          for idx,row in enumerate(rows,1):
              out=dict(row)
              doi=row.get('doi','').strip().lower(); aid=row.get('arxiv_id','').strip()
              cr=None; oa=None; s2=None
              if doi:
                  crj,err=json_req('https://api.crossref.org/works/'+urllib.parse.quote(doi,safe=''))
                  cr=(crj or {}).get('message') if crj else None; out['crossref_error']=err; time.sleep(.08)
                  oaj,err=json_req('https://api.openalex.org/works/https://doi.org/'+urllib.parse.quote(doi,safe='/:')+'?mailto=ryang54@jh.edu')
                  oa=oaj; out['openalex_error']=err; time.sleep(.08)
                  s2j,err=json_req('https://api.semanticscholar.org/graph/v1/paper/DOI:'+urllib.parse.quote(doi,safe='')+'?fields=title,abstract,year,venue,publicationTypes,publicationDate,externalIds,openAccessPdf,citationCount,referenceCount')
                  s2=s2j; out['s2_error']=err; time.sleep(.12)
              elif aid:
                  oaj,err=json_req('https://api.openalex.org/works/https://arxiv.org/abs/'+urllib.parse.quote(aid,safe='')+'?mailto=ryang54@jh.edu')
                  oa=oaj; out['openalex_error']=err; time.sleep(.08)
                  s2j,err=json_req('https://api.semanticscholar.org/graph/v1/paper/ARXIV:'+urllib.parse.quote(aid,safe='')+'?fields=title,abstract,year,venue,publicationTypes,publicationDate,externalIds,openAccessPdf,citationCount,referenceCount')
                  s2=s2j; out['s2_error']=err; time.sleep(.12)
              if cr:
                  out.update({
                    'crossref_title':clean(' '.join(cr.get('title') or [])),
                    'crossref_abstract':clean(cr.get('abstract','')),
                    'crossref_type':clean(cr.get('type','')),
                    'crossref_container':clean('; '.join(cr.get('container-title') or [])),
                    'crossref_publisher':clean(cr.get('publisher','')),
                    'crossref_url':clean(cr.get('URL','')),
                    'crossref_citations':str(cr.get('is-referenced-by-count','')),
                  })
              if oa:
                  pl=oa.get('primary_location') or {}; src=pl.get('source') or {}; best=oa.get('best_oa_location') or {}
                  out.update({
                    'openalex_id':clean(oa.get('id','')),
                    'openalex_title':clean(oa.get('display_name','')),
                    'openalex_abstract':inv_abs(oa.get('abstract_inverted_index')),
                    'openalex_type':clean(oa.get('type','')),
                    'openalex_date':clean(oa.get('publication_date','')),
                    'openalex_citations':str(oa.get('cited_by_count','')),
                    'openalex_source':clean(src.get('display_name','')),
                    'openalex_landing':clean(pl.get('landing_page_url','')),
                    'openalex_pdf':clean(best.get('pdf_url','') or pl.get('pdf_url','')),
                    'openalex_topics':';'.join(clean((t.get('display_name') or '')) for t in (oa.get('topics') or [])[:10]),
                    'openalex_concepts':';'.join(clean((c.get('display_name') or '')) for c in (oa.get('concepts') or [])[:15]),
                  })
              if s2:
                  out.update({
                    's2_title':clean(s2.get('title','')),
                    's2_abstract':clean(s2.get('abstract','')),
                    's2_year':str(s2.get('year','') or ''),
                    's2_venue':clean(s2.get('venue','')),
                    's2_publication_types':';'.join(s2.get('publicationTypes') or []),
                    's2_date':clean(s2.get('publicationDate','')),
                    's2_citations':str(s2.get('citationCount','') or ''),
                    's2_references':str(s2.get('referenceCount','') or ''),
                    's2_pdf':clean((s2.get('openAccessPdf') or {}).get('url','')),
                  })
              if aid and aid in arxiv_meta: out.update(arxiv_meta[aid])
              abstracts=[out.get(k,'') for k in ('arxiv_abstract','s2_abstract','openalex_abstract','crossref_abstract') if out.get(k,'')]
              out['best_abstract']=max(abstracts,key=len) if abstracts else ''
              out.update(pdf_evidence(candidate_pdf_urls(row,oa,s2)))
              output.append(out)
              print(f'shard {shard}: {idx}/{len(rows)} {row.get("work_key")} pdf={bool(out.get("pdf_url_used"))} abs={bool(out.get("best_abstract"))}',flush=True)

          path=ROOT/'review-enrichment'/f'full_review_enriched_{shard}.jsonl.gz'
          with gzip.open(path,'wt',encoding='utf-8') as h:
              for r in output: h.write(json.dumps(r,ensure_ascii=False)+'\n')
          summary={
            'shard':shard,'rows':len(output),
            'with_abstract':sum(bool(r.get('best_abstract')) for r in output),
            'with_pdf_text':sum(bool(r.get('pdf_url_used')) for r in output),
            'starting_decisions':{d:sum(r.get('starting_decision')==d for r in output) for d in ('primary','secondary','pending')},
          }
          (ROOT/'review-enrichment'/f'summary_{shard}.json').write_text(json.dumps(summary,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,indent=2))
          PY

      - name: Upload enrichment shard
        uses: actions/upload-artifact@v4
        with:
          name: full-corpus-review-enrichment-${{ matrix.shard }}
          path: review-enrichment/
          if-no-files-found: error
