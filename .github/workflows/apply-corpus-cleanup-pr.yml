name: Apply corpus cleanup PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'cleanup/remove-six-noncorpus'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-six-noncorpus
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final corpus cleanup
        run: python3 scripts/apply_remove_six_noncorpus.py
      - name: Remove branch-local one-shot machinery
        run: |
          rm -f scripts/apply_remove_six_noncorpus.py
          rm -f .github/workflows/apply-remove-six.yml
      - name: Validate final corpus
        run: scripts/validate_all.sh
      - name: Commit generated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Apply final 187-work corpus cleanup"
          git push origin HEAD:cleanup/remove-six-noncorpus
