name: Adjudicate all 341 pending works

on:
  push:
    branches:
      - review-all-341-pending
    paths:
      - scripts/adjudicate_pending_341.py
      - .github/workflows/adjudicate-pending-341.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out corpus
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install source review tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Resolve all pending works
        run: python scripts/adjudicate_pending_341.py

      - name: Validate the final three-set corpus
        run: |
          python scripts/validate_authoritative_corpus.py
          if [ -x scripts/validate_all.sh ]; then scripts/validate_all.sh; fi

      - name: Remove the one-shot workflow
        run: rm -f .github/workflows/adjudicate-pending-341.yml

      - name: Commit the reviewed corpus
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Resolve all 341 pending works"
          git push origin HEAD:review-all-341-pending
