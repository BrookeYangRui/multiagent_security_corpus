name: Apply frozen general adjudication

on:
  push:
    branches:
      - freeze/general-adjudication-2026-08-18

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply adjudication
        run: python3 scripts/apply_general_adjudication.py

      - name: Validate frozen corpus
        run: python3 scripts/validate_three_set_corpus.py

      - name: Commit generated frozen views
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md FROZEN_SNAPSHOT.md GENERAL_CONTRIBUTION_ADJUDICATION.md corpus/set1_core.csv corpus/set2_emerging.csv corpus/set3_context.csv corpus/screened_out.csv corpus/review_ledger.csv corpus/summary.csv corpus/manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Apply frozen general adjudication"
          git push
