name: Promote source-reviewed three-set corpus

on:
  push:
    branches:
      - three-set-corpus-review
    paths:
      - corpus/manifest.json
      - corpus/set1_core.csv
      - corpus/set2_emerging.csv
      - corpus/set3_context.csv
      - corpus/review_ledger.csv
      - scripts/validate_three_set_corpus.py

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate source-review completeness
        run: |
          python scripts/validate_three_set_corpus.py
          python - <<'PY'
          import csv, json
          from pathlib import Path

          root = Path('.')
          manifest = json.loads((root/'corpus/manifest.json').read_text(encoding='utf-8'))
          inventory = manifest.get('source_file_inventory') or []
          parsed = sum(int(item.get('rows', 0)) for item in inventory)
          if parsed < 1000:
              raise SystemExit(f'incomplete source inventory: {parsed}')
          if manifest['counts']['set3_context'] < 10:
              raise SystemExit('context set is still implausibly small')
          for name in ('set1_core.csv', 'set2_emerging.csv'):
              with (root/'corpus'/name).open(encoding='utf-8-sig', newline='') as handle:
                  rows = list(csv.DictReader(handle))
              if any(row.get('evidence_basis') == 'title_metadata' for row in rows):
                  raise SystemExit(f'{name} still contains title-only evidence')
              if any(row.get('interaction_interfaces') in ('', 'unspecified') for row in rows):
                  raise SystemExit(f'{name} contains unspecified interfaces')
              if any(row.get('risk_or_property') in ('', 'unspecified') for row in rows):
                  raise SystemExit(f'{name} contains unspecified risks')
              if any(row.get('interaction_dependence') in ('', 'unclear') for row in rows):
                  raise SystemExit(f'{name} contains unclear dependence tags')
          print(json.dumps(manifest['counts'], sort_keys=True))
          PY

      - name: Promote reviewed tree to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          git merge --no-ff --no-edit origin/three-set-corpus-review
          rm -f .github/workflows/promote-source-reviewed-three-set.yml
          git add -A
          git commit -m "Remove one-shot three-set promotion workflow" || true
          git push origin main
