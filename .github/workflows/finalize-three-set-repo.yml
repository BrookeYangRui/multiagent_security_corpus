name: Finalize three-set corpus repository

on:
  push:
    branches:
      - three-set-corpus-review
    paths:
      - corpus/set1_core.csv
      - corpus/set2_emerging.csv
      - corpus/set3_context.csv
      - corpus/screened_out.csv
      - corpus/manifest.json
      - .github/workflows/finalize-three-set-repo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out corpus
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install authoritative validation entry points
        shell: bash
        run: |
          set -euo pipefail
          test -f corpus/set1_core.csv
          test -f corpus/set2_emerging.csv
          test -f corpus/set3_context.csv
          test -f corpus/screened_out.csv
          cat > scripts/validate_all.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          python scripts/validate_three_set_corpus.py
          EOF
          chmod +x scripts/validate_all.sh
          cat > scripts/validate_authoritative_corpus.py <<'EOF'
          #!/usr/bin/env python3
          from pathlib import Path
          import runpy
          runpy.run_path(str(Path(__file__).with_name("validate_three_set_corpus.py")), run_name="__main__")
          EOF
          chmod +x scripts/validate_authoritative_corpus.py
          rm -f .github/workflows/finalize-three-set-repo.yml

      - name: Validate all active corpus views
        run: scripts/validate_all.sh

      - name: Commit validation migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize three-set corpus validation"
          git push origin HEAD:three-set-corpus-review
