name: Reconcile secondary corpus review

on:
  push:
    branches:
      - reconcile-secondary-review-20260821

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: reconcile-secondary-review-20260821

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply minimal reconciliation
        run: python scripts/reconcile_secondary_review_2026_08_21.py

      - name: Validate combined corpus
        run: scripts/validate_all.sh

      - name: Commit reconciled state
        run: |
          rm .github/workflows/reconcile-secondary-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply later secondary review after full classification"
          git push origin HEAD:reconcile-secondary-review-20260821
