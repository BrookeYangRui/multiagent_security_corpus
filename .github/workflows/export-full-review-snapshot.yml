name: Export full corpus review snapshot

on:
  push:
    branches:
      - full-corpus-expert-review
    paths:
      - .github/workflows/export-full-review-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out corpus
        uses: actions/checkout@v4

      - name: Record snapshot
        run: |
          mkdir -p review-snapshot
          git rev-parse HEAD > review-snapshot/commit.txt
          cp corpus/primary.csv review-snapshot/
          cp corpus/secondary.csv review-snapshot/
          cp corpus/pending.csv review-snapshot/ || true
          cp corpus/review_queue.csv review-snapshot/
          cp corpus/decision_ledger.csv review-snapshot/
          cp corpus/routes.csv review-snapshot/
          cp corpus/manifest.json review-snapshot/
          cp corpus/summary.csv review-snapshot/
          cp -R papers review-snapshot/papers
          cp -R related_work review-snapshot/related_work
          cp AGENTS.md EXPERT_REVIEW.md README.md review-snapshot/

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: full-corpus-review-snapshot
          path: review-snapshot/
          if-no-files-found: error
