name: Sync final 201 corpus

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-final-201.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild active corpus and papers tree
        run: python3 scripts/_one_shot_sync_final_201.py
      - name: Validate final corpus
        run: python3 scripts/validate_corpus.py
      - name: Commit synchronized corpus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Make signed 201-work corpus authoritative"
          git push origin HEAD:main
