name: Build MAS scope audit

on:
  push:
    branches:
      - audit/mas-scope-201

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/mas-scope-201
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build audit table
        run: python3 scripts/build_mas_scope_audit_201.py
      - name: Commit audit table
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corpus/MAS_SCOPE_AUDIT_2026-08-23.csv
          git commit -m "Build 201 work MAS scope audit table"
          git push origin HEAD:audit/mas-scope-201
