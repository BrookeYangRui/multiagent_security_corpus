name: Build remaining 189 scope audit

on:
  push:
    branches:
      - audit/remaining-189-scope

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/remaining-189-scope
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build audit queue
        run: python3 scripts/build_remaining_189_scope_audit.py
      - name: Commit audit queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corpus/REMAINING_189_SCOPE_AUDIT.csv corpus/REMAINING_189_SCOPE_AUDIT_SUMMARY.md corpus/remaining_189_batches/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build remaining 189 scope audit queue"
          git push origin HEAD:audit/remaining-189-scope
