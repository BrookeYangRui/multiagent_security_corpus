name: Build remaining 187 scope audit

on:
  push:
    branches:
      - audit/remaining-187-scope

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/remaining-187-scope
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build audit table
        run: python3 scripts/build_remaining_187_scope_audit.py
      - name: Commit audit table
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corpus/REMAINING_187_SCOPE_AUDIT.csv corpus/REMAINING_187_SCOPE_AUDIT_SUMMARY.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build remaining 187 scope audit"
          git push origin HEAD:audit/remaining-187-scope
