name: Rebuild artifact README

on:
  push:
    branches:
      - artifact/source-links-minimal

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: artifact/source-links-minimal
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild artifact README
        run: python3 scripts/build_artifact_source_links.py
      - name: Validate
        run: |
          test "$(grep -cE '^[0-9]+\. \[' artifact/README.md)" -eq 189
          ! grep -q ' · ' artifact/README.md
          ! grep -q '`' artifact/README.md
      - name: Commit generated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifact/README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Simplify artifact source list"
          git push origin HEAD:artifact/source-links-minimal
