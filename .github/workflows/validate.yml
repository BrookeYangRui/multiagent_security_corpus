name: Validate corpus

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate corpus
        run: scripts/validate_all.sh

  sync_final_papers:
    if: github.event_name == 'pull_request' && github.head_ref == 'sync-final-papers-201'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out synchronization branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild papers from signed corpus
        run: python3 scripts/sync_final_papers.py

      - name: Validate synchronized repository
        run: scripts/validate_all.sh

      - name: Commit generated papers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git diff --cached --check
          git commit -m "Rebuild papers from final 201 corpus"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
