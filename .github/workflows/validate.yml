name: Validate corpus

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch verified identity corrections into one-shot integrator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply_evaluation_benchmark_reconciliation_v2.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('        if action == "alias_merge_upgrade":')
          end=s.index('\n        r = find(', start)
          block='''        if action == "alias_merge_upgrade":
              pre = [r for r in ledger if r.get("arxiv_id") == "2505.12442"]
              canon = [r for r in ledger if r.get("work_key") == "wang2026masleak"]
              if len(pre) != 1 or len(canon) != 1:
                  raise SystemExit(f"MASLeak identity merge expected one preprint and one canonical row, got {len(pre)} and {len(canon)}")
              r = pre[0]
              duplicate = canon[0]
              old = dict(r)
              ledger.remove(duplicate)
              r.update({
                  "work_key": "wang2026masleak", "canonical_paper_id": "wang2026masleak",
                  "title": "MASLeak: Investigating and Exposing Intellectual Property Leakage Vulnerabilities in Multi-Agent Systems",
                  "venue": "USENIX Security 2026", "year": "2026", "arxiv_id": "2505.12442",
                  "primary_url": "https://www.usenix.org/conference/usenixsecurity26/presentation/wang-liwen",
                  "strict_scope_pass": "yes", "evidence_set": "set1_core",
                  "peer_reviewed": "yes", "peer_review_basis": "published USENIX Security 2026 paper",
                  "maturity_rule_pass": "yes", "dominant_contribution": "attack",
                  "citation_role": "", "paper_section": "", "emerging_direction": "",
                  "decision_reason": "2026-08-18 identity correction: merged duplicate arXiv and canonical USENIX records into published MASLeak and upgraded to Set 1.",
                  "reviewer": REVIEWER, "reviewed_at": DATE, "author_signoff_required": "yes",
              })
              original["wang2026masleak"] = old
              record(r, "identity_merge_and_maturity_upgrade", d["reason_code"], d["confidence"])
              continue
'''
          s=s[:start]+block+s[end:]
          s=s.replace('if len(ledger) != 2216: raise SystemExit("reconciliation must preserve 2,216-work universe")', 'if len(ledger) != 2215: raise SystemExit("reconciliation must produce the deduplicated 2,215-work universe")')
          s=s.replace('text = text.replace("if len(ledger) != 2217:", "if len(ledger) != 2216:")', 'text = text.replace("if len(ledger) != 2217:", "if len(ledger) != 2215:")')
          s=s.replace('if sum(counts.values()) != 2216 or counts["set1_core"] + counts["set2_emerging"] != 226:', 'if sum(counts.values()) != 2215 or counts["set1_core"] + counts["set2_emerging"] != 226:')
          s=s.replace('m["search_universe"] = 2216;', 'm["search_universe"] = 2215;')
          s=s.replace('The frozen ledger contains 2,216 deduplicated works', 'The frozen ledger contains 2,215 deduplicated works')
          s=s.replace('A2ASecBench already existed in the deduplicated review ledger and is promoted rather than added, so the review universe remains 2,216 works.', 'A2ASecBench already existed in the deduplicated review ledger and is promoted rather than added. The duplicate MASLeak preprint/published identities are merged, reducing the review universe to 2,215 works.')
          s=s.replace('if len(L)!=2216 or set().union(*K.values())', 'if len(L)!=2215 or set().union(*K.values())')
          s=s.replace('m["search_universe"]!=2216', 'm["search_universe"]!=2215')
          s=s.replace('"universe":2216', '"universe":2215')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Apply evaluation and benchmark reconciliation
        run: python3 scripts/apply_evaluation_benchmark_reconciliation_v2.py

      - name: Validate generated corpus
        run: scripts/validate_all.sh

      - name: Commit generated corpus revision
        run: |
          rm -f .github/workflows/apply-evaluation-benchmark-reconciliation.yml
          rm -f scripts/apply_evaluation_benchmark_reconciliation.py
          rm -f scripts/apply_evaluation_benchmark_reconciliation_v2.py
          git checkout origin/main -- .github/workflows/validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Freeze reconciled 226-work corpus [reconciliation-generated]"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
