name: Validate corpus

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect reconciled identities
        run: |
          python3 - <<'PY'
          import csv
          with open('corpus/review_ledger.csv', encoding='utf-8-sig', newline='') as f:
              rows=list(csv.DictReader(f))
          for r in rows:
              if r.get('work_key') == 'li2026a2asecbench' or r.get('work_key') == 'wang2026masleak' or r.get('arxiv_id') == '2505.12442':
                  print({k:r.get(k,'') for k in ['work_key','title','evidence_set','strict_scope_pass','peer_reviewed','maturity_rule_pass','dominant_contribution','arxiv_id','citation_role']})
          print('ledger_rows',len(rows))
          PY

      - name: Apply evaluation and benchmark reconciliation
        run: python3 scripts/apply_evaluation_benchmark_reconciliation_v2.py

      - name: Validate generated corpus
        run: scripts/validate_all.sh

      - name: Commit generated corpus revision
        run: |
          rm -f .github/workflows/apply-evaluation-benchmark-reconciliation.yml
          rm -f scripts/apply_evaluation_benchmark_reconciliation.py
          rm -f scripts/apply_evaluation_benchmark_reconciliation_v2.py
          git checkout origin/main -- .github/workflows/validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Freeze reconciled 226-work corpus [reconciliation-generated]"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
