name: Validate corpus

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate corpus
        run: |
          python scripts/build_peer_first_eligibility.py --check
          python scripts/build_universal_review_queue.py
          python scripts/build_corpus_sets.py
          python scripts/build_final_exports.py
          python scripts/validate_corpus.py
          python scripts/validate_corpus_sets.py
          git diff --exit-code
